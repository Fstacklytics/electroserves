# Decap CMS — GitHub backend + in-repo GitHub OAuth Netlify Function
#
# Netlify's Git Gateway (and its OAuth proxy) are deprecated (sunset 2026), so
# this site authenticates editors directly against GitHub via a GitHub OAuth
# App, with the OAuth dance handled by an in-repo Netlify Function:
#   netlify/functions/oauth.js
# routed at `backend.base_url` below (auth_endpoint appends /auth, and the
# Function appends /auth/callback for GitHub's redirect).
#
# HOW THIS WORKS
#   1. A GitHub OAuth App (GitHub -> Settings -> Developer settings -> GitHub
#      Apps) is created. Homepage URL = the site root; Redirect URI =
#      <base_url>/auth/callback. Repo permissions: Contents: Read and write,
#      Metadata: Read-only; webhook off.
#   2. Its Client ID + Client Secret are stored as Netlify site environment
#      variables OAUTH_GITHUB_CLIENT_ID / OAUTH_GITHUB_CLIENT_SECRET — never
#      committed to this repo. The Function exchanges the code for a token and
#      bounces Decap to /admin/?provider=github&token=...
#   3. Editors need Write collaborator/team access on the repo to sign in.
#
# Do NOT commit the OAuth client secret anywhere in this repo — it lives only
# in the Netlify Function's environment variables.
backend:
  name: github
  repo: Fstacklytics/electroserves
  branch: main
  base_url: https://electroserve.netlify.app/.netlify/functions/oauth
  auth_endpoint: /auth
  # public_repo is enough for a public repo; use "repo" for a private one.
  auth_scope: public_repo
  commit_messages:
    create: "content(create): {{collection}} — {{slug}}"
    update: "content(update): {{collection}} — {{slug}}"
    delete: "content(delete): {{collection}} — {{slug}}"
    uploadMedia: "media(upload): {{path}}"
    deleteMedia: "media(delete): {{path}}"

# Simple (direct) mode: every Save commits straight to `main`, which triggers
# the Netlify Production build. There is no editorial-workflow "Ready / Publish
# / Unpublish" menu — that menu was the source of the "API_ERROR: Update is not
# a fast forward" failures (it tried to update a stale cms/* branch). Hiding an
# entry is done with the Published toggle, not an Unpublish action.
publish_mode: simple

# Local development uses the local backend proxy (run `netlify dev`).
local_backend: true

# Media is committed under public/uploads so Netlify serves it at /uploads/*.
media_folder: "public/uploads"
public_folder: "/uploads"

# Decap "View live" / the CMS site link use these values — not the host the
# editor opened /admin on. Keep them on the host that actually serves this
# Netlify site. electroserves.co.tz has no public DNS yet (2026-08-12), so
# the working production URL is the Netlify subdomain. Switch both back to
# https://electroserves.co.tz (and set SITE_URL the same way) once that
# domain is added in Netlify → Domain management and resolves.
site_url: https://electroserve.netlify.app
display_url: https://electroserve.netlify.app

editor:
  preview: false

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

collections:

  # ----------------------------------------------------------
  # Site Settings (single file) — never deletable
  # ----------------------------------------------------------
  - name: "settings"
    label: "Site Settings"
    # Protect the site + SEO config: do not let an editor delete these files.
    delete: false
    files:
      - label: "General Settings"
        name: "site_settings"
        file: "content/settings/site.yml"
        fields:
          - { label: "Site Name", name: "site_name", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Phone Number", name: "phone", widget: "string" }
          - { label: "Emergency Phone", name: "emergency_phone", widget: "string" }
          - { label: "Email Address", name: "email", widget: "string" }
          - { label: "Physical Address", name: "address", widget: "text" }
          - { label: "City", name: "city", widget: "string", default: "Dar es Salaam" }
          - { label: "Country", name: "country", widget: "string", default: "Tanzania" }
          - { label: "Google Maps Embed URL", name: "map_embed_url", widget: "string", required: false }
          - label: "Business Hours"
            name: "business_hours"
            widget: "list"
            fields:
              - { label: "Day", name: "day", widget: "string" }
              - { label: "Hours", name: "hours", widget: "string" }
          - label: "Social Media Links"
            name: "social_links"
            widget: "object"
            fields:
              - { label: "Facebook", name: "facebook", widget: "string", required: false }
              - { label: "Instagram", name: "instagram", widget: "string", required: false }
              - { label: "Twitter/X", name: "twitter", widget: "string", required: false }
              - { label: "LinkedIn", name: "linkedin", widget: "string", required: false }
              - { label: "YouTube", name: "youtube", widget: "string", required: false }
              - { label: "WhatsApp", name: "whatsapp", widget: "string", required: false }
          - { label: "Copyright Text", name: "copyright", widget: "string" }
          - { label: "Logo", name: "logo", widget: "image", required: false }
          - { label: "Favicon", name: "favicon", widget: "image", required: false }
          - { label: "Years in Business", name: "years_in_business", widget: "number", required: false }
          - { label: "Projects Completed", name: "projects_completed", widget: "number", required: false }
          - { label: "Happy Clients", name: "happy_clients", widget: "number", required: false }
          - { label: "Team Size", name: "team_size", widget: "number", required: false }

      - label: "SEO Defaults"
        name: "seo_defaults"
        file: "content/settings/seo.yml"
        fields:
          - { label: "Default Meta Title", name: "default_title", widget: "string" }
          - { label: "Default Meta Description", name: "default_description", widget: "text" }
          - { label: "Default OG Image", name: "default_og_image", widget: "image", required: false }
          - { label: "Twitter Handle", name: "twitter_handle", widget: "string", required: false }
          - { label: "Google Site Verification", name: "google_verification", widget: "string", required: false }

  # ----------------------------------------------------------
  # Hero Slides
  # ----------------------------------------------------------
  - name: "hero_slides"
    label: "Hero Slides"
    folder: "content/hero"
    create: true
    preview_path: ""
    # Required: the build only loads content/hero/*.yml. Without these Decap
    # defaults to Markdown and publishes *.md files the loader never sees.
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: "heading"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Heading", name: "heading", widget: "string" }
      - { label: "Subheading", name: "subheading", widget: "text" }
      - { label: "Background Image", name: "image", widget: "image", required: false, hint: "One background photo for this homepage slide. To show several images in the rotating homepage carousel, add more **Hero Slides** (each with its own photo) and use **Order** to set the sequence — lower numbers appear first." }
      - { label: "CTA Button Text", name: "cta_text", widget: "string", default: "Get a Quote" }
      - { label: "CTA Button Link", name: "cta_link", widget: "string", default: "/contact" }
      - { label: "Secondary CTA Text", name: "cta_secondary_text", widget: "string", required: false }
      - { label: "Secondary CTA Link", name: "cta_secondary_link", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."

  # ----------------------------------------------------------
  # Services
  # ----------------------------------------------------------
  - name: "services"
    label: "Services"
    folder: "content/services"
    create: true
    extension: "md"
    format: "frontmatter"
    preview_path: "services/{{fields.slug}}"
    slug: "{{slug}}"
    identifier_field: "title"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Icon Name", name: "icon", widget: "string", hint: "home, building, cpu, wrench, shield, lightbulb, battery or bolt" }
      - { label: "Short Description", name: "short_description", widget: "text", hint: "Used on services overview page" }
      - { label: "Full Description", name: "body", widget: "markdown" }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - label: "Features / What's Included"
        name: "features"
        widget: "list"
        fields:
          - { label: "Feature", name: "feature", widget: "string" }
      - { label: "Price Range", name: "price_range", widget: "string", required: false }
      - { label: "Category", name: "category", widget: "select", options: ["residential", "commercial", "electronics", "emergency", "installation"] }
      - { label: "Order (display position)", name: "order", widget: "number", default: 1 }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }

  # ----------------------------------------------------------
  # Projects / Portfolio
  # ----------------------------------------------------------
  - name: "projects"
    label: "Projects"
    folder: "content/projects"
    create: true
    extension: "md"
    format: "frontmatter"
    preview_path: "projects/{{fields.slug}}"
    slug: "{{slug}}"
    identifier_field: "title"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Category", name: "category", widget: "select", options: ["residential", "commercial", "industrial", "electronics", "installation"] }
      - { label: "Short Description", name: "short_description", widget: "text" }
      - { label: "Full Description", name: "body", widget: "markdown" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - label: "Image Gallery"
        name: "gallery"
        widget: "list"
        fields:
          - { label: "Image", name: "image", widget: "image", required: false, hint: "One photo per row. Add as many rows as you like — they appear in the project's image gallery. Add a caption for context, or leave the caption blank to list it as a 'Project highlight'." }
          - { label: "Caption", name: "caption", widget: "string", required: false }
      - { label: "Client Name", name: "client_name", widget: "string", required: false }
      - { label: "Location", name: "location", widget: "string" }
      - { label: "Completion Date", name: "completion_date", widget: "datetime", format: "YYYY-MM-DD", time_format: false }
      - label: "Services Used"
        name: "services_used"
        widget: "relation"
        collection: "services"
        search_fields: ["title"]
        value_field: "slug"
        display_fields: ["title"]
        multiple: true
        required: false
      - { label: "Featured Project", name: "featured", widget: "boolean", default: false }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }

  # ----------------------------------------------------------
  # Blog Posts
  # ----------------------------------------------------------
  - name: "blog"
    label: "Blog"
    folder: "content/blog"
    create: true
    extension: "md"
    format: "frontmatter"
    preview_path: "blog/{{fields.slug}}"
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    identifier_field: "title"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime", default: "{{now}}", format: "YYYY-MM-DD" }
      - { label: "Category", name: "category", widget: "select", options: ["Tips & Advice", "Industry News", "Company Updates", "Project Spotlights", "Safety"] }
      - { label: "Tags", name: "tags", widget: "list", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Body", name: "body", widget: "markdown" }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }

  # ----------------------------------------------------------
  # Testimonials
  # ----------------------------------------------------------
  - name: "testimonials"
    label: "Testimonials"
    folder: "content/testimonials"
    create: true
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: "client_name"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Client Name", name: "client_name", widget: "string" }
      - { label: "Company / Organization", name: "company", widget: "string", required: false }
      - { label: "Rating (1-5)", name: "rating", widget: "number", min: 1, max: 5, default: 5 }
      - { label: "Testimonial Quote", name: "quote", widget: "text" }
      - { label: "Client Photo", name: "photo", widget: "image", required: false }
      - { label: "Service Used", name: "service_used", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."

  # ----------------------------------------------------------
  # Team Members
  # ----------------------------------------------------------
  - name: "team"
    label: "Team Members"
    folder: "content/team"
    create: true
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: "name"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Full Name", name: "name", widget: "string" }
      - { label: "Role / Title", name: "role", widget: "string" }
      - { label: "Bio", name: "bio", widget: "markdown" }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - label: "Certifications"
        name: "certifications"
        widget: "list"
        required: false
        fields:
          - { label: "Certification Name", name: "name", widget: "string" }
          - { label: "Issuing Body", name: "issuer", widget: "string", required: false }
          - { label: "Year", name: "year", widget: "number", required: false }
      - { label: "Email (public)", name: "email", widget: "string", required: false }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."

  # ----------------------------------------------------------
  # FAQs
  # ----------------------------------------------------------
  - name: "faqs"
    label: "FAQs"
    folder: "content/faqs"
    create: true
    extension: "yml"
    format: "yml"
    slug: "{{slug}}"
    identifier_field: "question"
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Question", name: "question", widget: "string" }
      - { label: "Answer", name: "answer", widget: "markdown" }
      - { label: "Category", name: "category", widget: "select", options: ["General", "Services", "Pricing", "Emergency", "Warranty"] }
      - { label: "Order", name: "order", widget: "number", default: 1 }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."

  # ----------------------------------------------------------
  # Static Pages — never deletable (about / privacy / terms)
  # ----------------------------------------------------------
  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    extension: "md"
    format: "frontmatter"
    preview_path: "{{fields.slug}}"
    slug: "{{slug}}"
    identifier_field: "title"
    filter: { field: "layout", value: "page" }
    # Protect the legal/structural pages: do not let an editor delete them.
    delete: false
    view_filters:
      - label: "Visible"
        field: published
        pattern: 'true'
      - label: "Hidden"
        field: published
        pattern: 'false'
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "page" }
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Body", name: "body", widget: "markdown" }
      - { label: "Featured Image", name: "featured_image", widget: "image", required: false }
      - { label: "Meta Description", name: "meta_description", widget: "text", required: false }
      - { label: "Last Updated", name: "updated_at", widget: "datetime", format: "YYYY-MM-DD", time_format: false, required: false }
      - label: "Published"
        name: "published"
        widget: "boolean"
        default: true
        hint: "Visible = included in the next Production build. Hidden (Off) = skipped from the public site on the next deploy. Toggle this to show/hide — there is no separate Unpublish button."
