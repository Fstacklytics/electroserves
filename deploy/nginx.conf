###############################################################################
# ElectroServes — Nginx server configuration
#
# Target: Nginx 1.18+ (Ubuntu 22.04 LTS ships 1.18; 24.04 ships 1.24) in front
# of PHP-FPM running a Laravel 11 application.
#
# Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/electroserves
#   sudo ln -s /etc/nginx/sites-available/electroserves /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# EVERY value marked "CUSTOMISE" must be reviewed before this file is used.
# Full walkthrough, including TLS issuance and rollback: deploy/README.md
#
# Relationship to the application
# -------------------------------
# Security headers are set by App\Http\Middleware\SecurityHeadersMiddleware on
# every response, in every environment, so they are covered by the test suite.
# They are NOT duplicated here. Nginx's `add_header` silently drops all
# inherited add_header directives from an outer block the moment a location
# adds one of its own, which makes duplicated header sets a reliable source of
# production-only header loss. Where this file does add headers it is only for
# static files that never pass through PHP (see the asset locations below).
#
# Page caching is handled inside Laravel by App\Services\ResponseCacheService,
# which knows which routes are visitor-specific. Nginx does NOT proxy-cache
# PHP responses here; doing so would bypass those rules and risk serving one
# visitor's CSRF token to another. Nginx caches only immutable static assets.
###############################################################################


# --- Rate limiting zones -----------------------------------------------------
# Declared at http{} scope. If you include this file from inside an existing
# http{} block (the usual sites-enabled arrangement) these two lines must be
# moved to /etc/nginx/nginx.conf or a file in /etc/nginx/conf.d/, because
# limit_req_zone is not valid inside server{}.
#
# The contact zone is a coarse network-level backstop, deliberately LOOSER than
# the application limiter in App\Providers\RateLimitServiceProvider (5 requests
# per IP per hour). Laravel owns the real policy and returns a friendly,
# translated message; Nginx only absorbs floods large enough to be worth
# stopping before PHP is involved. Keep this looser than the app limit so that
# legitimate users always receive the application's response, not a bare 429.
#
# limit_req_zone $binary_remote_addr zone=electroserves_contact:10m rate=30r/m;
# limit_req_zone $binary_remote_addr zone=electroserves_general:10m rate=120r/m;


###############################################################################
# HTTP :80 — ACME challenges and redirect to HTTPS
###############################################################################
server {
    listen 80;
    listen [::]:80;

    # CUSTOMISE: your domain(s).
    server_name electroserves.co.tz www.electroserves.co.tz;

    # Certbot writes its challenge files here. This must stay reachable over
    # plain HTTP or certificate renewal will fail.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


###############################################################################
# HTTPS :443 — the application
###############################################################################
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    # CUSTOMISE: your domain(s).
    server_name electroserves.co.tz www.electroserves.co.tz;

    # --- Document root -------------------------------------------------------
    # CUSTOMISE: the `current` symlink is flipped atomically by the release
    # process described in deploy/README.md. Point it at the PUBLIC directory —
    # never at the project root, which would expose .env, storage/ and vendor/.
    root /var/www/electroserves/current/public;
    index index.php;

    charset utf-8;

    # --- TLS -----------------------------------------------------------------
    # CUSTOMISE: paths written by certbot for your domain.
    ssl_certificate     /etc/letsencrypt/live/electroserves.co.tz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/electroserves.co.tz/privkey.pem;

    # TLS 1.2 and 1.3 only. TLS 1.0/1.1 are deprecated and rejected by the
    # supported browser matrix (Chrome 90+, Firefox 90+, Safari 14+, Edge 90+),
    # all of which negotiate 1.2 or better.
    ssl_protocols TLSv1.2 TLSv1.3;

    # Modern AEAD suites only. TLS 1.3 suites are negotiated separately and are
    # not affected by this list.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:ElectroServesTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. Requires a resolver; CUSTOMISE to your provider's DNS or a
    # local caching resolver.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/electroserves.co.tz/chain.pem;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # NOTE: Strict-Transport-Security is sent by the application middleware
    # whenever the request is secure, so it is not repeated here. If you
    # terminate TLS at a load balancer that does not forward X-Forwarded-Proto,
    # the app cannot detect HTTPS — fix the proxy headers rather than adding
    # HSTS here, otherwise the app's other security headers would be dropped by
    # Nginx's add_header inheritance rules.

    # --- Request limits ------------------------------------------------------
    # The contact form is text-only and the CMS commits images through the
    # GitHub API rather than uploading them here, so a small body limit is
    # sufficient. CUSTOMISE upward only if you add direct uploads.
    client_max_body_size 2m;
    client_body_buffer_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;

    # Do not advertise the exact Nginx version in responses or error pages.
    server_tokens off;

    # No directory listings anywhere.
    autoindex off;

    # --- Logging -------------------------------------------------------------
    # CUSTOMISE paths if you use a different log location or ship logs to a
    # central collector. Rotation is handled by the packaged logrotate config.
    access_log /var/log/nginx/electroserves.access.log;
    error_log  /var/log/nginx/electroserves.error.log warn;

    # --- Compression ---------------------------------------------------------
    # Never compress responses to a request that carries a session cookie in a
    # way that mixes secrets and attacker-controlled input — Laravel's CSRF
    # token is per-session and the site has no attacker-reflected content in
    # compressed responses, so gzip is safe here. gzip is not applied to
    # already-compressed formats.
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        application/atom+xml
        image/svg+xml
        application/manifest+json;

    # Brotli compresses this site's CSS and JS roughly 15-20% smaller than gzip
    # at the same CPU cost. It is NOT enabled above because stock Nginx has no
    # Brotli module. To enable it:
    #
    #   sudo apt install libnginx-mod-http-brotli-filter libnginx-mod-http-brotli-static
    #
    # then uncomment the following. Keep gzip enabled as well: Nginx serves
    # whichever the client's Accept-Encoding allows.
    #
    # brotli on;
    # brotli_comp_level 5;
    # brotli_static on;          # serve pre-built .br files when present
    # brotli_types text/plain text/css text/xml text/javascript
    #              application/javascript application/json application/xml
    #              image/svg+xml application/manifest+json;

    # --- Hidden and sensitive files -----------------------------------------
    # Deny dotfiles, but keep the ACME challenge path working. `^~` gives this
    # prefix match priority over the regex locations below.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    # Everything else beginning with a dot: .env, .git, .htaccess, .user.ini.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Files that must never be served even if they somehow land in public/.
    # `return 404` rather than 403 avoids confirming that the file exists.
    location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|artisan|phpunit\.xml|\.env.*|.*\.(?:sql|sqlite|db|bak|swp|log|ini|sh|yml|yaml|md))$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # Defence in depth: the docroot is public/, so these directories are not
    # reachable in a correct deployment. This blocks them anyway in case the
    # root is ever misconfigured to the project directory.
    location ~ ^/(?:vendor|storage|bootstrap|app|config|database|resources|routes|tests|node_modules|content)/ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- Vite build assets ---------------------------------------------------
    # Filenames from `npm run build` contain a content hash (app-DEG3TnDB.css),
    # so the bytes behind a given URL can never change. Cache them forever and
    # skip the PHP round trip entirely.
    #
    # This is one of the few places add_header is used. Because this location
    # never reaches PHP, the application's security headers do not apply to it
    # and nothing is being overridden — but note that adding any further
    # add_header inside this block is what would drop the ones already here.
    location ^~ /build/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;

        # A missing hashed asset means a stale HTML page is referencing an old
        # build. Fail fast with a 404 rather than handing the request to PHP.
        try_files $uri =404;
    }

    # Other static files served straight from public/ (favicons, logos, robots
    # images, uploaded media). These are NOT content-hashed, so they get a
    # shorter TTL and must revalidate.
    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff|woff2|ttf|eot|otf)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # --- Contact form --------------------------------------------------------
    # Submissions are personal data and must never be cached or stored by any
    # intermediary. Laravel already excludes both /contact and the POST from its
    # response cache (config/electroserves.php -> response_cache.excluded_routes);
    # this block is the network-level counterpart.
    location = /contact {
        # limit_req zone=electroserves_contact burst=10 nodelay;   # see zones above

        # Belt and braces: no proxy or CDN in front of this server may keep a
        # copy of the form (it carries a CSRF token) or of the result page.
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        fastcgi_no_cache 1;
        fastcgi_cache_bypass 1;

        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- Laravel front controller -------------------------------------------
    location / {
        # limit_req zone=electroserves_general burst=40 nodelay;   # see zones above
        try_files $uri $uri/ /index.php?$query_string;
    }

    # --- PHP-FPM -------------------------------------------------------------
    location ~ ^/index\.php(/|$) {
        # CUSTOMISE: must match the pool's `listen` value in
        # /etc/php/8.3/fpm/pool.d/www.conf.
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;

        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;

        # $realpath_root resolves the release symlink, so opcache does not keep
        # serving the previous release's files after a deploy.
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        fastcgi_param PATH_INFO       $fastcgi_path_info;

        # Tell Laravel the original request was HTTPS. bootstrap/app.php trusts
        # proxies, so these are what make $request->isSecure() true and let the
        # middleware emit HSTS and build correct absolute URLs.
        fastcgi_param HTTPS on;
        fastcgi_param REQUEST_SCHEME https;

        # Refuse to execute a path that does not resolve to a real file. Without
        # this, a request such as /uploads/evil.jpg/index.php could be passed to
        # PHP on some configurations.
        try_files $uri =404;

        fastcgi_index index.php;
        fastcgi_hide_header X-Powered-By;

        fastcgi_read_timeout 30s;
        fastcgi_send_timeout 30s;
        fastcgi_connect_timeout 5s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # No other .php file may be executed. Only the front controller above is a
    # legitimate entry point.
    location ~ \.php$ {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    # --- CORS ----------------------------------------------------------------
    # No wildcard CORS. The site serves its own pages and fonts and exposes no
    # cross-origin API, so no Access-Control-Allow-Origin header is sent at all.
    # If a future integration needs one, add it for a specific named origin on a
    # specific location — never `*`, and never on a route that requires a
    # session cookie.
}
