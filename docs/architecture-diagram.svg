<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="650" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="450" y="40" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">ElectroServes — System Architecture</text>
  <text x="450" y="62" fill="#94a3b8" font-size="12" text-anchor="middle">Laravel + Decap CMS + File-Based Content</text>

  <!-- Trust Boundary Box -->
  <rect x="30" y="80" width="600" height="540" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="50" y="100" fill="#64748b" font-size="11" font-weight="600">SERVER TRUST BOUNDARY</text>

  <!-- Visitor -->
  <rect x="55" y="130" width="150" height="70" rx="10" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="130" y="160" fill="white" font-size="13" font-weight="600" text-anchor="middle">👤 Visitor</text>
  <text x="130" y="180" fill="#bfdbfe" font-size="10" text-anchor="middle">Browser (Mobile/Desktop)</text>

  <!-- Arrow: Visitor → Nginx -->
  <line x1="205" y1="165" x2="270" y2="165" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <defs><marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60a5fa"/></marker></defs>
  <text x="237" y="155" fill="#94a3b8" font-size="9" text-anchor="middle">HTTPS</text>

  <!-- Nginx -->
  <rect x="275" y="125" width="150" height="80" rx="10" fill="#334155" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="152" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">⚡ Nginx</text>
  <text x="350" y="170" fill="#94a3b8" font-size="10" text-anchor="middle">SSL Termination</text>
  <text x="350" y="185" fill="#94a3b8" font-size="10" text-anchor="middle">Static Files + Proxy</text>

  <!-- Arrow: Nginx → PHP-FPM -->
  <line x1="350" y1="205" x2="350" y2="245" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- PHP-FPM / Laravel -->
  <rect x="245" y="250" width="210" height="100" rx="10" fill="#334155" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="278" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">🔧 PHP-FPM + Laravel</text>
  <text x="350" y="296" fill="#94a3b8" font-size="10" text-anchor="middle">Route → Controller → Service</text>
  <text x="350" y="312" fill="#94a3b8" font-size="10" text-anchor="middle">→ Blade Template → HTML</text>
  <text x="350" y="330" fill="#c4b5fd" font-size="9" text-anchor="middle">CSRF · Validation · Caching</text>

  <!-- Arrow: Laravel → Content Files -->
  <line x1="350" y1="350" x2="350" y2="395" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <defs><marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#a855f7"/></marker></defs>
  <text x="390" y="375" fill="#c4b5fd" font-size="9">Read</text>

  <!-- Content Files -->
  <rect x="235" y="400" width="230" height="120" rx="10" fill="#334155" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="425" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">📁 Content Files</text>
  <text x="350" y="445" fill="#94a3b8" font-size="10" text-anchor="middle">Markdown + YAML Frontmatter</text>
  <text x="275" y="465" fill="#86efac" font-size="9">services/</text>
  <text x="275" y="480" fill="#86efac" font-size="9">projects/</text>
  <text x="275" y="495" fill="#86efac" font-size="9">blog/</text>
  <text x="355" y="465" fill="#86efac" font-size="9">testimonials/</text>
  <text x="355" y="480" fill="#86efac" font-size="9">team/</text>
  <text x="355" y="495" fill="#86efac" font-size="9">faqs/</text>
  <text x="425" y="465" fill="#86efac" font-size="9">settings/</text>
  <text x="425" y="480" fill="#86efac" font-size="9">hero/</text>
  <text x="425" y="495" fill="#86efac" font-size="9">uploads/</text>

  <!-- Arrow: Content → Git -->
  <line x1="350" y1="520" x2="350" y2="555" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <defs><marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22c55e"/></marker></defs>

  <!-- Git Repository -->
  <rect x="260" y="560" width="180" height="45" rx="8" fill="#334155" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="350" y="582" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">📦 Git Repository</text>
  <text x="350" y="597" fill="#94a3b8" font-size="9" text-anchor="middle">Version Control + Audit Trail</text>

  <!-- External: GitHub -->
  <rect x="680" y="250" width="190" height="90" rx="10" fill="#334155" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="278" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">🐙 GitHub</text>
  <text x="775" y="296" fill="#94a3b8" font-size="10" text-anchor="middle">Remote Repository</text>
  <text x="775" y="312" fill="#94a3b8" font-size="10" text-anchor="middle">OAuth Provider</text>
  <text x="775" y="328" fill="#fbbf24" font-size="9" text-anchor="middle">Actions CI/CD</text>

  <!-- Arrow: Git → GitHub -->
  <line x1="440" y1="582" x2="680" y2="295" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <defs><marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#f59e0b"/></marker></defs>
  <text x="580" y="430" fill="#fbbf24" font-size="9" transform="rotate(-28, 580, 430)">push / pull</text>

  <!-- Content Admin -->
  <rect x="680" y="400" width="190" height="70" rx="10" fill="url(#amber)" filter="url(#shadow)"/>
  <text x="775" y="428" fill="white" font-size="13" font-weight="600" text-anchor="middle">👨‍💼 Content Admin</text>
  <text x="775" y="448" fill="#fef3c7" font-size="10" text-anchor="middle">Non-technical staff</text>

  <!-- Arrow: Admin → Decap CMS -->
  <line x1="775" y1="470" x2="775" y2="505" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- Decap CMS -->
  <rect x="680" y="510" width="190" height="80" rx="10" fill="#334155" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="775" y="535" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">📝 Decap CMS</text>
  <text x="775" y="553" fill="#94a3b8" font-size="10" text-anchor="middle">/admin (React SPA)</text>
  <text x="775" y="570" fill="#c4b5fd" font-size="9" text-anchor="middle">Web-based content editor</text>
  <text x="775" y="583" fill="#c4b5fd" font-size="9" text-anchor="middle">Markdown + Image upload</text>

  <!-- Arrow: CMS → GitHub (OAuth + commits) -->
  <line x1="775" y1="510" x2="775" y2="340" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowPurple)"/>
  <text x="790" y="420" fill="#c4b5fd" font-size="9">OAuth +</text>
  <text x="790" y="432" fill="#c4b5fd" font-size="9">Git Commits</text>

  <!-- Email Service -->
  <rect x="55" y="280" width="150" height="60" rx="8" fill="#334155" stroke="#60a5fa" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="303" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">✉️ Email Service</text>
  <text x="130" y="320" fill="#94a3b8" font-size="9" text-anchor="middle">Contact Form → SMTP</text>

  <!-- Arrow: Laravel → Email -->
  <line x1="245" y1="300" x2="205" y2="300" stroke="#60a5fa" stroke-width="1.5" marker-end="url(#arrowBlue)" transform="rotate(180, 225, 300)"/>

  <!-- Static Assets -->
  <rect x="55" y="400" width="150" height="60" rx="8" fill="#334155" stroke="#475569" stroke-width="1" filter="url(#shadow)"/>
  <text x="130" y="423" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">🎨 Static Assets</text>
  <text x="130" y="440" fill="#94a3b8" font-size="9" text-anchor="middle">CSS · JS · Images · Fonts</text>
  <text x="130" y="452" fill="#94a3b8" font-size="9" text-anchor="middle">Served by Nginx directly</text>

  <!-- Arrow: Nginx → Static -->
  <line x1="275" y1="190" x2="200" y2="400" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Legend -->
  <rect x="55" y="540" width="170" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="65" y="558" fill="#94a3b8" font-size="10" font-weight="600">Legend</text>
  <line x1="65" y1="572" x2="95" y2="572" stroke="#60a5fa" stroke-width="2"/>
  <text x="100" y="576" fill="#94a3b8" font-size="9">HTTP / Data Flow</text>
  <line x1="65" y1="590" x2="95" y2="590" stroke="#a855f7" stroke-width="2"/>
  <text x="100" y="594" fill="#94a3b8" font-size="9">File Read / CMS Action</text>
  <line x1="65" y1="604" x2="95" y2="604" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="100" y="608" fill="#94a3b8" font-size="9">Git Sync (async)</text>

  <!-- CI/CD Box -->
  <rect x="680" y="130" width="190" height="80" rx="10" fill="#334155" stroke="#22c55e" stroke-width="1" filter="url(#shadow)"/>
  <text x="775" y="155" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">🔄 GitHub Actions CI/CD</text>
  <text x="775" y="173" fill="#94a3b8" font-size="9" text-anchor="middle">Lint → Test → Build → Deploy</text>
  <text x="775" y="188" fill="#94a3b8" font-size="9" text-anchor="middle">Secret Scan · Audit · ZAP</text>
  <text x="775" y="203" fill="#86efac" font-size="9" text-anchor="middle">On push to main branch</text>

  <!-- Arrow: GitHub → CI/CD -->
  <line x1="775" y1="250" x2="775" y2="210" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrowGreen)"/>
</svg>
