<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="Inter, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#60a5fa"/></marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#22c55e"/></marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#f59e0b"/></marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#a855f7"/></marker>
  </defs>

  <!-- Background -->
  <rect width="960" height="600" fill="url(#bg)" rx="12"/>

  <!-- Title -->
  <text x="480" y="38" fill="#f8fafc" font-size="22" font-weight="700" text-anchor="middle">ElectroServes — Current Architecture (Path B)</text>
  <text x="480" y="60" fill="#94a3b8" font-size="12" text-anchor="middle">Astro static site · Tailwind + Alpine · Decap CMS · Netlify (Identity + Git Gateway + Forms)</text>

  <!-- ===== Build-time boundary ===== -->
  <rect x="30" y="85" width="600" height="300" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="50" y="106" fill="#64748b" font-size="11" font-weight="600">BUILD TIME — Astro static generation (npm run build → dist/)</text>

  <!-- Content files -->
  <rect x="55" y="125" width="220" height="130" rx="10" fill="#334155" stroke="#22c55e" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="165" y="150" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">📁 content/</text>
  <text x="165" y="168" fill="#94a3b8" font-size="10" text-anchor="middle">Markdown + YAML in Git</text>
  <text x="95" y="188" fill="#86efac" font-size="9">services/ projects/</text>
  <text x="95" y="202" fill="#86efac" font-size="9">blog/ pages/</text>
  <text x="200" y="188" fill="#86efac" font-size="9">testimonials/</text>
  <text x="200" y="202" fill="#86efac" font-size="9">team/ faqs/ hero/</text>
  <text x="165" y="222" fill="#86efac" font-size="9" text-anchor="middle">settings/{site,seo}.yml</text>
  <text x="165" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">validated by zod (src/content/config.ts)</text>

  <!-- Arrow: content -> Astro -->
  <line x1="275" y1="190" x2="335" y2="190" stroke="#22c55e" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- Astro build -->
  <rect x="340" y="120" width="265" height="140" rx="10" fill="#334155" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="472" y="146" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">⚡ Astro static build</text>
  <text x="472" y="164" fill="#94a3b8" font-size="10" text-anchor="middle">src/pages · layouts · components</text>
  <text x="472" y="180" fill="#94a3b8" font-size="10" text-anchor="middle">Tailwind CSS + Alpine.js islands</text>
  <text x="472" y="196" fill="#c4b5fd" font-size="9" text-anchor="middle">gray-matter + yaml + rehype-sanitize</text>
  <text x="472" y="216" fill="#fbbf24" font-size="10" text-anchor="middle">→ static HTML/CSS/JS in dist/_assets/</text>
  <text x="472" y="234" fill="#94a3b8" font-size="9" text-anchor="middle">no PHP runtime · no database · no server cache</text>

  <!-- public/ -->
  <rect x="55" y="285" width="220" height="75" rx="10" fill="#334155" stroke="#64748b" stroke-width="1" filter="url(#shadow)"/>
  <text x="165" y="310" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">🎨 public/</text>
  <text x="165" y="328" fill="#94a3b8" font-size="9" text-anchor="middle">admin/ (Decap host + config.yml)</text>
  <text x="165" y="343" fill="#94a3b8" font-size="9" text-anchor="middle">uploads/ · robots.txt · favicon</text>
  <line x1="165" y1="285" x2="380" y2="260" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- dist output -->
  <rect x="340" y="300" width="265" height="60" rx="10" fill="url(#green)" filter="url(#shadow)"/>
  <text x="472" y="325" fill="white" font-size="13" font-weight="600" text-anchor="middle">📦 dist/ — static output</text>
  <text x="472" y="345" fill="#dcfce7" font-size="10" text-anchor="middle">27 pre-rendered pages · hashed immutable assets</text>

  <!-- ===== Deploy / runtime boundary ===== -->
  <rect x="30" y="405" width="900" height="170" rx="10" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="50" y="426" fill="#64748b" font-size="11" font-weight="600">RUNTIME — Netlify CDN (free Starter plan)</text>

  <!-- Netlify -->
  <rect x="55" y="445" width="240" height="110" rx="10" fill="#334155" stroke="#60a5fa" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="175" y="471" fill="#f8fafc" font-size="13" font-weight="600" text-anchor="middle">🌐 Netlify CDN</text>
  <text x="175" y="489" fill="#94a3b8" font-size="9" text-anchor="middle">global static hosting + automatic TLS</text>
  <text x="175" y="505" fill="#94a3b8" font-size="9" text-anchor="middle">security headers + CSP from netlify.toml</text>
  <text x="175" y="521" fill="#94a3b8" font-size="9" text-anchor="middle">Netlify Forms (contact honeypot)</text>
  <text x="175" y="540" fill="#fbbf24" font-size="9" text-anchor="middle">build command npm run build → publish dist/</text>

  <!-- Visitor -->
  <rect x="360" y="455" width="170" height="55" rx="10" fill="url(#blue)" filter="url(#shadow)"/>
  <text x="445" y="480" fill="white" font-size="13" font-weight="600" text-anchor="middle">👤 Visitor</text>
  <text x="445" y="498" fill="#bfdbfe" font-size="9" text-anchor="middle">browser (mobile/desktop)</text>
  <line x1="295" y1="485" x2="360" y2="482" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>
  <line x1="360" y1="495" x2="295" y2="500" stroke="#60a5fa" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- Editor -->
  <rect x="360" y="525" width="170" height="38" rx="10" fill="url(#amber)" filter="url(#shadow)"/>
  <text x="445" y="549" fill="white" font-size="12" font-weight="600" text-anchor="middle">👨‍💼 Editor → /admin</text>

  <!-- Identity / Decap -->
  <rect x="600" y="445" width="150" height="55" rx="10" fill="#334155" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="468" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">🔐 Netlify Identity</text>
  <text x="675" y="486" fill="#c4b5fd" font-size="9" text-anchor="middle">invitations · login</text>

  <rect x="600" y="510" width="150" height="55" rx="10" fill="#334155" stroke="#a855f7" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="675" y="533" fill="#f8fafc" font-size="11" font-weight="600" text-anchor="middle">📝 Decap CMS</text>
  <text x="675" y="551" fill="#c4b5fd" font-size="9" text-anchor="middle">Git Gateway → commits/PRs</text>

  <!-- GitHub -->
  <rect x="780" y="478" width="140" height="55" rx="10" fill="#334155" stroke="#f59e0b" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="850" y="501" fill="#f8fafc" font-size="12" font-weight="600" text-anchor="middle">🐙 GitHub</text>
  <text x="850" y="518" fill="#fbbf24" font-size="9" text-anchor="middle">merge to main → rebuild</text>

  <!-- arrows runtime -->
  <line x1="530" y1="544" x2="600" y2="540" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="675" y1="510" x2="675" y2="500" stroke="#a855f7" stroke-width="1.5"/>
  <line x1="750" y1="537" x2="780" y2="510" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="850" y1="478" x2="295" y2="445" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arrowAmber)"/>
  <text x="600" y="438" fill="#fbbf24" font-size="9">push / editorial PR triggers Netlify build</text>

  <!-- Legend -->
  <rect x="660" y="125" width="270" height="120" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="675" y="146" fill="#94a3b8" font-size="10" font-weight="600">Legend</text>
  <line x1="675" y1="160" x2="705" y2="160" stroke="#60a5fa" stroke-width="2"/>
  <text x="712" y="164" fill="#94a3b8" font-size="9">HTTP request / response</text>
  <line x1="675" y1="178" x2="705" y2="178" stroke="#a855f7" stroke-width="2"/>
  <text x="712" y="182" fill="#94a3b8" font-size="9">CMS / auth action</text>
  <line x1="675" y1="196" x2="705" y2="196" stroke="#22c55e" stroke-width="2"/>
  <text x="712" y="200" fill="#94a3b8" font-size="9">Content read at build time</text>
  <line x1="675" y1="214" x2="705" y2="214" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="712" y="218" fill="#94a3b8" font-size="9">Git push / deploy trigger</text>
  <text x="675" y="236" fill="#64748b" font-size="8">No PHP, Nginx, database or server cache in Path B</text>

  <!-- Historical note -->
  <text x="480" y="592" fill="#475569" font-size="9" text-anchor="middle">Replaces the retired Nginx + PHP-FPM + Laravel diagram. See docs/ARCHITECTURE.md.</text>
</svg>
