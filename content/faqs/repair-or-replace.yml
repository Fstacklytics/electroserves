question: How do I know whether to repair or replace equipment?
answer: >-
  We give you the numbers and let you decide. Our diagnosis report states what failed,
  what the repair costs, and what a replacement would cost — and we say plainly when we
  think a unit has reached the end of its economic life. Roughly one in five units
  brought to our workshop is not worth repairing, and we tell people so.
