question: Will I lose power while you work?
answer: >-
  Usually only in stages. Most jobs allow us to isolate one circuit at a time so the
  rest of the property keeps working. A distribution board replacement does require the
  property to be off for most of a working day, and we tell you that clearly at quote
  stage. For businesses we schedule main isolations outside trading hours.
