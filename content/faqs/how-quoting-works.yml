question: How does your quoting process work?
answer: >-
  For small residential jobs we can usually quote from a clear description and a few
  photographs. For anything involving three-phase supply, a rewire or a backup system,
  we survey the site first — quoting that work blind produces a number that changes
  later, which helps nobody. Surveys for quoted work are free within Dar es Salaam.
