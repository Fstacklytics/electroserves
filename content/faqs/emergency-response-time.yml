question: How quickly can you attend an emergency?
answer: >-
  Our target is 90 minutes within Dar es Salaam and up to three hours for outlying
  areas. When you call we give you a realistic time for that night rather than a
  standard figure. If we cannot reach you quickly enough, we tell you on the phone and
  talk you through making the installation safe in the meantime.
