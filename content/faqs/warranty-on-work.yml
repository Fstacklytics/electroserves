question: What warranty do you give?
answer: >-
  Installation work carries a twelve-month warranty on our workmanship. Electronics
  repairs carry a 90-day warranty covering the fault we repaired and the components we
  fitted. Manufacturer warranties on supplied equipment — inverters, batteries, panels —
  are passed through to you in full, and we handle the claim on your behalf.
