question: What counts as an electrical emergency?
answer: >-
  Call us immediately if you can smell burning, see scorching or smoke around a socket
  or board, feel warmth on a distribution board, have received a shock from a tap or
  appliance, or your main breaker will not stay on. Switch off at the main isolator
  first. A single tripped circuit that resets and holds is usually not an emergency and
  can wait until morning.
