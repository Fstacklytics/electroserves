question: Which areas do you cover?
answer: >-
  We cover all of Dar es Salaam including Masaki, Oyster Bay, Mikocheni, Kariakoo,
  Upanga and Kigamboni, plus the surrounding areas along Bagamoyo Road and towards
  Kisarawe. For larger commercial projects we travel further — ask us and we will tell
  you honestly whether we are the right contractor for the distance.
