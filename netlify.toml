# ElectroServes — Path B (Netlify)
#
# Replaces the old Nginx + PHP-FPM deployment (deploy/nginx.conf +
# deploy/README.md). The site is fully static (Astro build output in dist/),
# so the hardening that used to live in Nginx and SecurityHeadersMiddleware now
# lives here as response headers, and the contact form is handled by Netlify
# Forms with a honeypot.

[build]
  command = "npm run build"
  publish = "dist"

# Canonical origin used by astro.config.mjs / sitemap / JSON-LD.
# Temporary: electroserves.co.tz has no public DNS (verified 2026-08-12).
# After the custom domain is added in Netlify → Domain management, resolves,
# and is set as the primary domain, change this (or override it in the
# Netlify UI environment variables) to https://electroserves.co.tz.
[build.environment]
  SITE_URL = "https://zippy-kitten-7cad33.netlify.app"

# Immutable hashed assets get a long cache. Astro writes build assets to
# dist/_assets/ with content hashes in the filename.
[[headers]]
  for = "/_assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers for the whole site. These replace Nginx hardening +
# SecurityHeadersMiddleware from the Laravel build.
#
# CSP is deliberately conservative: scripts from self and the Netlify Identity
# host (the admin login widget), styles from self + Google Fonts, fonts from
# fonts.gstatic.com, images from self + data: URIs. The /admin/* rule below
# relaxes script-src so the Decap CMS bundle (served from unpkg) can load.
#
# Standard Alpine.js evaluates template bindings (x-show / :class / x-on /
# x-text) with new Function() at runtime, so the public site needs
# 'unsafe-eval'. Remove it only after migrating to Alpine's CSP build
# (@alpinejs/csp).
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' https://identity.netlify.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'"

# The Decap CMS admin page must be able to load its own JS bundle from unpkg
# and the Netlify Identity widget; the strict site CSP would block those.
#
# 'unsafe-eval' is required here and on the public site. Decap CMS (AJV)
# compiles the config.yml JSON Schema with `new Function()` at load time.
# Without it the admin UI reports "Error loading the CMS configuration /
# EvalError". The public-site CSP also needs it because standard Alpine.js
# evaluates template bindings with `new Function()` at runtime.
#
# blob: is required on img-src and connect-src so Decap can preview and process
# local file selections before the Git Gateway media upload. Without it the
# admin UI fails with "Failed to persist entry: TypeError: Failed to fetch"
# and CSP violations on blob: image/fetch URLs — before any upload request is
# sent. connect-src also allows unpkg (source maps for the pinned Decap
# bundle) and www.netlifystatus.com (Netlify Identity status checks).
#
# Cover both /admin (trailingSlash: never) and /admin/* (index.html, config.yml).
[[headers]]
  for = "/admin"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://identity.netlify.com https://unpkg.com https://www.netlifystatus.com"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' blob: https://identity.netlify.com https://unpkg.com https://www.netlifystatus.com"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
